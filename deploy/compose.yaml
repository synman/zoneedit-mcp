# zoneedit-mcp on its Docker host. Build and run from the deploy directory (the one beside this file):
#   docker compose --env-file ./site.vars -f compose.yaml up -d --build
# Layout beside this file (all owned by DEPLOY_UID / DEPLOY_GID):
#   site.vars              this deployment's site values (copy site.vars.example; no secret in it)
#   zoneedit-mcp.env       MCP_ADMIN_TOKEN_HASH=<sha256 of the fleet token>, 0600; never the token
#   vault/                 zoneedit-mcp.vault + zoneedit-mcp.key, holding ONLY the two panel credentials and the TOTP seed;
#                          built and refreshed from the main vault by deploy/zoneedit_admin.py vault sync
#   node-vault-mcp/        holds services/secrets.py and services/vault_secrets/, mounted read-only at
#                          /opt/node-vault-mcp (so the CLI path is node-vault-mcp/services/secrets.py)
# The port binds the host loopback only. The reverse proxy in front of it is the only LAN-facing path.
services:
  zoneedit-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zoneedit-mcp:local
    container_name: zoneedit-mcp
    # Docker's default bridge, as amt-mcp's compose: a proxy that admits only the LAN and that bridge
    # reaches the port. A compose network would need its own allow rule.
    network_mode: bridge
    user: "${DEPLOY_UID:?set in site.vars}:${DEPLOY_GID:?set in site.vars}"
    restart: unless-stopped
    shm_size: 512m
    env_file: ./zoneedit-mcp.env
    environment:
      # Chromium needs a writable HOME; the image's home belongs to the image user, not DEPLOY_UID.
      HOME: /tmp
      ZONEEDIT_BIND_HOST: 0.0.0.0
      ZONEEDIT_PORT: "8768"
      ZONEEDIT_ALLOWED_HOSTS: ${ZONEEDIT_ALLOWED_HOSTS:?set in site.vars}
      ZONEEDIT_SECRETS_CLI: /opt/node-vault-mcp/services/secrets.py
      ZONEEDIT_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
      NVAULT_VAULT_PATH: /vault/zoneedit-mcp.vault
      NVAULT_MASTER_KEY_FILE: /vault/zoneedit-mcp.key
    volumes:
      - ./vault:/vault
      - ./node-vault-mcp:/opt/node-vault-mcp:ro
    ports:
      - "127.0.0.1:8768:8768"
