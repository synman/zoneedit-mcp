[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zoneedit-mcp"
version = "1.9.1"
description = "ZoneEdit DNS records over bearer-gated streamable HTTP (headless browser)"
requires-python = ">=3.11"
# Floor 1.26: the bearer gate overrides FastMCP.call_tool/read_resource/get_prompt.
dependencies = ["mcp>=1.26,<2", "patchright"]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[project.scripts]
zoneedit-mcp = "zoneedit_server:main"

[tool.setuptools]
py-modules = ["zoneedit_gate", "zoneedit_vault", "zoneedit_totp", "zoneedit_panel", "zoneedit_session", "zoneedit_tools", "zoneedit_writes", "zoneedit_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
