<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Synthetic DNS editor</title></head><body>
<!-- Synthetic page written for these tests. Invented data on the example.com zone. It holds only the markup the parser and the page steps read, and it copies no page, script or style from any service. -->
<form method="post" name="formAddRecord" id="form-add-record-a"><div class="add-record row rounded p-2 m-0 border border-2 border-secondary"><h2 class="fw-light">Add Record</h2><div class="col-md-2"><div class="fw-light">TYPE</div><select name="type" required=""><option value="A" selected>A</option><option value="CAA">CAA</option><option value="CNAME">CNAME</option><option value="MX">MX</option><option value="TXT">TXT</option></select></div><div class="col-md-4"><div class="fw-light">HOST</div><input type="text" name="host" required="" placeholder="@"><span class="text-muted">.example.com</span><div class="alert alert-danger p-2 lh-base" role="alert" data-field="err_h" style="display: none;"><i class="bi bi-exclamation-triangle-fill"></i> </div><div class="alert alert-warning p-2 lh-base" role="alert" data-field="warn_h" style="display: none;"><i class="bi bi-exclamation-triangle-fill"></i> <span style="display: none;">(Confirm to replace)</span></div></div><div class="col-md-4"><div class="fw-light">IP ADDRESS</div><input autocomplete="off" name="content" required="" placeholder="192.0.2.1"><div class="alert alert-warning p-2 lh-base" role="alert" data-field="warn_i" style="display: none;"><span style="display: none;">(Confirm to replace)</span></div></div><div class="col-md-2"><div class="fw-light">TTL</div><select name="ttl" required=""><option value="0" selected>[DEF]&nbsp;2 hours</option><option value="300">5 minutes</option><option value="3600">1 hour</option><option value="86400">1 day</option></select></div><div class="col-12 mt-3"><div class="text-end"><button type="button" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</button><button type="submit" class="btn btn-success ms-2"><i class="bi bi-save"></i> Save</button><button type="submit" class="btn btn-success ms-2" disabled="" style="display: none;"> Saving</button><button type="submit" class="btn btn-warning ms-2" style="display: none;"><i class="bi bi-check"></i> Confirm</button></div></div></div></form>
</body></html>
